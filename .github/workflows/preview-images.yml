# Images for test environments (spec 016, Arffornia/docs). Prod is not affected: it runs
# `latest`, which only build-and-push-images.yml publishes.
#
# - push to main: `main` and `main-<sha7>` (staging.arffornia.com runs `main`);
# - pull_request from this repository: `pr-<n>` and `pr-<n>-<sha7>`, built from the PR head
#   (a playtest slot pr1-pr3.arffornia.com pins `pr-<n>-<sha7>`);
# - pull_request closed: try to delete that PR's tags (needs admin on the packages; a failure
#   only leaves old tags behind).
# Fork PRs never get an image.
name: Preview images

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: preview-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: arffornia/arffornia_website
            file: ./prod.Dockerfile
            scope: preview-laravel
          - image: arffornia/nginx_arffornia_website
            file: ./nginx.Dockerfile
            scope: preview-nginx
    steps:
      - name: Checkout the PR head (or main)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          prefix="main"; [ -n "$PR" ] && prefix="pr-$PR"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${prefix}"
            echo "${IMAGE}:${prefix}-${SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - name: Delete the pr-<n> tags
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          for pkg in arffornia_website nginx_arffornia_website; do
            ids="$(gh api --paginate "orgs/arffornia/packages/container/${pkg}/versions" \
              --jq ".[] | select(any(.metadata.container.tags[]; . == \"pr-${PR}\" or startswith(\"pr-${PR}-\"))) | .id")" || { echo "cannot list ${pkg}"; continue; }
            for id in $ids; do
              gh api -X DELETE "orgs/arffornia/packages/container/${pkg}/versions/${id}" && echo "deleted ${pkg} version ${id}" || echo "could not delete ${pkg} version ${id}"
            done
          done
