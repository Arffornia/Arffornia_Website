name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, zip, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: make check
        run: make check

  postgres:
    # Row locks, advisory locks and ON CONFLICT behave differently on sqlite; the progression and API suites run on Postgres too.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arffornia
          POSTGRES_PASSWORD: arffornia
          POSTGRES_DB: arffornia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arffornia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: arffornia_test
      DB_USERNAME: arffornia
      DB_PASSWORD: arffornia
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, zip, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Progression and API suites on Postgres
        run: |
          cp .env.example .env
          php artisan key:generate
          vendor/bin/phpunit tests/Feature/Progression tests/Feature/Api

  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: tokens.css matches Arffornia_Assets main
        run: make tokens-check
