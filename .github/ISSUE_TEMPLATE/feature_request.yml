name: Feature request
description: Propose a change or a new feature
labels: ["type: feature", "area: website", "proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
