{{- if .Values.itemTextures.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "arffornia-website.fullname" . }}-item-textures
  labels:
    {{- include "arffornia-website.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.itemTextures.persistence.storageClass | default "" | quote }}
  resources:
    requests:
      storage: {{ .Values.itemTextures.persistence.size }}
{{- end }}
