{{- if .Values.migrateAndSeedDB }}
{{- if .Values.migrateAndSeedDB.enabled }}
{{- fail "migrateAndSeedDB was removed: it ran migrate:fresh (drops all tables). Use migrations.enabled for `migrate --force`, or dangerouslyResetDatabase.enabled to wipe and reseed." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arffornia-website.fullname" . }}
  labels:
    {{- include "arffornia-website.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "arffornia-website.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "arffornia-website.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "arffornia-website.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}-backend
          {{- with (merge (deepCopy .Values.securityContext) .Values.backendSecurityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}

          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          command:
            - "/bin/sh"
            - "-c"
            - |
              set -e

              echo "Preparing application..."

              {{- if .Values.dangerouslyResetDatabase.enabled }}
              echo "dangerouslyResetDatabase.enabled=true: DROPPING ALL TABLES and reseeding..."
              php artisan migrate:fresh --seed --force
              {{- else if .Values.migrations.enabled }}
              echo "Running pending database migrations..."
              php artisan migrate --force
              {{- end }}

              {{- if .Values.syncServiceAccounts.enabled }}
              echo "Synchronizing service accounts (enabled)..."
              php artisan app:sync-service-accounts
              {{- else }}
              echo "Skipping service account synchronization (disabled)."
              {{- end }}

              echo "Starting application..."
              exec php-fpm

          ports:
            - name: fastcgi
              containerPort: {{ .Values.images.backend.port }}
              protocol: TCP

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.itemTextures.persistence.enabled }}
          volumeMounts:
            {{- if .Values.itemTextures.persistence.enabled }}
            - name: item-textures
              mountPath: {{ .Values.itemTextures.persistence.mountPath }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}

        - name: {{ .Chart.Name }}-frontend
          {{- with (merge (deepCopy .Values.securityContext) .Values.frontendSecurityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}

          # nginx only needs its own settings: application env and secrets (env/envFrom) go to the backend only.
          env:
            - name: TARGET_HOST
              value: {{ .Values.images.backend.host | default "127.0.0.1" | quote }}
            - name: TARGET_PORT
              value: {{ .Values.images.backend.port | default 9000 | quote }}
            - name: LISTEN_PORT
              value: {{ .Values.images.frontend.port | quote }}
            {{- with .Values.frontendEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          ports:
            - name: http
              containerPort: {{ .Values.images.frontend.port }}
              protocol: TCP

          {{- if .Values.liveness.enabled }}
          livenessProbe:
            {{- toYaml .Values.liveness.spec | nindent 12 }}
          {{- end }}
          {{- if .Values.readiness.enabled }}
          readinessProbe:
            {{- toYaml .Values.readiness.spec | nindent 12 }}
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.itemTextures.persistence.enabled }}
          volumeMounts:
            {{- if .Values.itemTextures.persistence.enabled }}
            - name: item-textures
              mountPath: {{ .Values.itemTextures.persistence.mountPath }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      volumes:
        {{- if .Values.itemTextures.persistence.enabled }}
        - name: item-textures
          persistentVolumeClaim:
            claimName: {{ include "arffornia-website.fullname" . }}-item-textures
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
