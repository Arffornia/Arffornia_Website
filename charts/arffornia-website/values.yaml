replicaCount: 1

images:
  # Image of the front / web server used (default nginx)
  frontend:
    repository: ghcr.io/arffornia/nginx_arffornia_website
    pullPolicy: Always
    tag: ""
    # Port nginx listens on inside the pod. Must be > 1024 because nginx runs as a non-root user.
    # The Service still exposes `service.port` (80) and targets this port by name.
    port: 8080

  # Image of the Laravel app used
  backend:
    repository: ghcr.io/arffornia/arffornia_website
    pullPolicy: Always
    tag: ""
    port: 9000
    host: "127.0.0.1"

# If enabled, the application will synchronize service accounts on startup using SVC_ACCOUNT_ prefixed environment variables.
syncServiceAccounts:
  enabled: false

# If enabled, pending database migrations are applied on startup with `php artisan migrate --force`
# (non-destructive: existing tables and data are kept).
migrations:
  enabled: false

# DANGER: if enabled, every pod start runs `php artisan migrate:fresh --seed --force`, which DROPS ALL
# TABLES and reseeds demo data. Only for throwaway environments. Never enable it in production.
# (Seeding needs dev dependencies, which production images do not ship.)
# This replaces the former `migrateAndSeedDB` option; setting `migrateAndSeedDB.enabled` now fails the render.
dangerouslyResetDatabase:
  enabled: false

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials? The app does not call the Kubernetes API.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "arffornia-website"

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # www-data in the php:alpine image; gives the backend write access to mounted volumes
  fsGroup: 82
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Applied to both containers, then merged with the per-container values below.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem needs writable emptyDirs for storage/, bootstrap/cache and nginx temp dirs (follow-up).
  readOnlyRootFilesystem: false

# php-fpm runs as www-data (uid/gid 82 in php:*-alpine).
backendSecurityContext:
  runAsUser: 82
  runAsGroup: 82

# nginx runs as the nginx user (uid/gid 101 in nginx:*-alpine).
frontendSecurityContext:
  runAsUser: 101
  runAsGroup: 101

# Environment of the Laravel (backend) container only.
env: []
  # - name: MY_DOMAIN
  #   value: "example.com"

# Secrets and ConfigMaps for the Laravel (backend) container only. They are not given to nginx.
envFrom: []
# - secretRef:
#     name: my-secret
# - configMapRef:
#     name: my-config-map

# Extra environment for the nginx (frontend) container.
frontendEnv: []

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: arffornia.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Liveness and readiness probes of the nginx (frontend) container. php-fpm speaks FastCGI, not HTTP.
# More information: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
liveness:
  enabled: false
  spec:
    httpGet:
      path: /
      port: http

readiness:
  enabled: false
  spec:
    httpGet:
      path: /
      port: http

# ---------------------------------------------------------------------------
# Item Textures — Persistent storage for the ~30k Minecraft item icon PNGs
# exported by the Item Icon Exporter mod.
# ---------------------------------------------------------------------------
itemTextures:
  persistence:
    # Set to true to create a PersistentVolumeClaim and mount it in the pods.
    enabled: true
    # Storage class to use. Leave empty to use the cluster default.
    storageClass: ""
    # How much storage to request. 30k PNGs ≈ 1–2 Gi depending on resolution.
    size: 1Gi
    # Mount path inside both containers (backend php-fpm + frontend nginx).
    mountPath: /var/www/html/public/images/item_textures

# Additional volumes on the output Deployment definition.
# The item_textures PVC is injected automatically above when enabled.
# Use this for any extra volumes you need.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
# Applied to BOTH the backend and frontend containers.
volumeMounts: []
# - name: item-textures
#   mountPath: /var/www/html/public/images/item_textures
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
