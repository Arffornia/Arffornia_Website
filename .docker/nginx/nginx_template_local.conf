server {
    listen ${LISTEN_PORT} default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html/public;

    client_max_body_size 10M;

    # Security headers. `always` also sends them on error responses.
    # Note: an add_header inside a location block replaces all of these for that location.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # TLS is terminated by the gateway; browsers ignore this header on plain-HTTP responses.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Report-only first: violations are logged in the browser console, nothing is blocked.
    # Switch to Content-Security-Policy once the console is clean on every page.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com https://discord.com https://mineskin.eu; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    index index.php;

    charset utf-8;

    access_log /dev/stdout;
    error_log /dev/stdout;


    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Only the Laravel front controller is executed by php-fpm.
    location = /index.php {
        fastcgi_pass ${TARGET_HOST}:${TARGET_PORT};
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Any other .php file is never executed nor served.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
